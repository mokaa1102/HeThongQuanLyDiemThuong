<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Nhóm 8</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: none !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .title-main {
            color: #0d6efd;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(13, 110, 253, 0.3);
        }

        .subtitle {
            color: #495057;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ced4da;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            height: 55px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        .admin-info {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="header">
    TRANG QUẢN TRỊ VIÊN - NHÓM 8
</div>

<div class="container mt-5">
    <div class="row text-center mb-5 g-4">
        <div class="col-md-4">
            <div class="card bg-primary p-5 shadow-lg stats-card">
                <h2 class="display-4 fw-bold" th:text="${#lists.size(users)}">0</h2>
                <p class="fs-3">TỔNG NGƯỜI DÙNG</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success p-5 shadow-lg stats-card">
                <h2 class="display-4 fw-bold"
                    th:text="${tongDiem != null ? #numbers.formatInteger(tongDiem, 0, 'COMMA') : '0'} + ' điểm'">
                    0 điểm
                </h2>
                <p class="fs-3">TỔNG ĐIỂM TRONG HỆ THỐNG</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info p-5 shadow-lg stats-card">
                <h2 class="display-4 fw-bold" th:text="${tongGD != null ? tongGD : 0}">0</h2>
                <p class="fs-3">TỔNG GIAO DỊCH</p>
            </div>
        </div>
    </div>

    <h3 class="text-center mb-4 fw-bold">DANH SÁCH NGƯỜI DÙNG</h3>
    <div class="table-responsive">
        <table class="table table-striped table-hover table-dark">
            <thead class="table-warning text-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên đăng nhập</th>
                    <th>Họ tên</th>
                    <th>Vai trò</th>
                    <th>Số dư ví</th>
                    <th>Trừ điểm</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.tenDangNhap}">admin</td>
                    <td th:text="${u.hoTen != null ? u.hoTen : 'Chưa đặt'}">Chưa đặt</td>
                    <td>
                        <span th:if="${u.vaiTro == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                        <span th:if="${u.vaiTro != 'ADMIN'}" class="badge bg-secondary">USER</span>
                    </td>
                    <td th:text="${soDuMap[u.id] != null ? #numbers.formatInteger(soDuMap[u.id], 0, 'COMMA') + ' điểm' : '0 điểm'}">0 điểm</td>
                    <td class="text-center">
                        <a th:href="@{/admin/tru-diem/{id}(id=${u.id})}" class="btn btn-danger btn-sm rounded-pill px-3 shadow">Trừ điểm</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-5">
        <a th:href="@{/admin/tao-nguoi-dung}" class="btn btn-success btn-lg px-5 rounded-pill shadow me-3">+ Tạo người dùng mới</a>
        <a th:href="@{/admin/danh-sach-nguoi-dung}" class="btn btn-success btn-lg px-5 rounded-pill shadow me-3">Quản lý người dùng</a>
        <a th:href="@{/trang-chu}" class="btn btn-warning btn-lg px-5 rounded-pill shadow">Quay lại trang chủ</a>
    </div>
</div>

</body>
</html>
