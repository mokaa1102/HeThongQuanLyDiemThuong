<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo người dùng mới - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .header {
            background: linear-gradient(135deg, #ffc107, #ff8f00);
            color: #212529;
            padding: 25px;
            text-align: center;
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            border-bottom: 5px solid #e0a800;
        }
        .card {
            background: rgba(15, 15, 35, 0.95) !important;
            border: 2px solid #ffc107;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 193, 7, 0.4);
        }
        .form-label {
            color: #ffc107 !important;
            font-weight: 800;
            font-size: 1.1rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ffc107;
            color: white !important;
            font-weight: bold;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ff8f00;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
            color: white;
        }
        .form-control::placeholder {
            color: #ffeb99 !important;
            opacity: 0.9;
        }
        .btn-success {
            background: linear-gradient(45deg, #28a745, #34ce57);
            border: none;
            font-weight: bold;
            padding: 12px 40px;
            font-size: 1.2rem;
        }
        .btn-success:hover {
            background: linear-gradient(45deg, #218838, #28a745);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.5);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            font-weight: bold;
            padding: 12px 40px;
            font-size: 1.2rem;
        }
        .alert-danger {
            background: rgba(220, 53, 69, 0.95);
            border: 2px solid #ff6b6b;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    TẠO NGƯỜI DÙNG MỚI
</div>

<div class="container mt-5">
    <div class="card p-5 shadow-lg">
        <form th:action="@{/admin/tao-nguoi-dung}" method="post">
            <div class="mb-4">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="tenDangNhap" class="form-control form-control-lg" required 
                       placeholder="Nhập tên đăng nhập (3-20 ký tự)" minlength="3" maxlength="20"/>
            </div>

            <div class="mb-4">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="matKhau" class="form-control form-control-lg" required 
                       placeholder="Mật khẩu ít nhất 4 ký tự" minlength="4"/>
            </div>

            <div class="mb-4">
                <label class="form-label">Họ và tên</label>
                <input type="text" name="hoTen" class="form-control form-control-lg" required 
                       placeholder="Ví dụ: Nguyễn Văn A"/>
            </div>

            <div class="mb-5">
                <label class="form-label">Vai trò</label>
                <select name="vaiTro" class="form-select form-select-lg">
                    <option value="USER">USER (Người dùng thường)</option>
                    <option value="ADMIN">ADMIN (Quản trị viên)</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg px-5 rounded-pill shadow-lg">
                    TẠO NGƯỜI DÙNG NGAY
                </button>
                <a th:href="@{/admin}" class="btn btn-secondary btn-lg px-5 rounded-pill ms-3 shadow">
                    Quay lại Dashboard
                </a>
            </div>
        </form>

        <div th:if="${error}" class="alert alert-danger mt-4 text-center py-4 fs-5">
            <strong>Cảnh báo:</strong> <span th:text="${error}">Lỗi gì đó</span>
        </div>

        <div th:if="${success}" class="alert alert-success mt-4 text-center py-4 fs-5">
            <strong>Thành công!</strong> <span th:text="${success}">Tạo thành công!</span>
        </div>
    </div>
</div>

</body>
</html>
