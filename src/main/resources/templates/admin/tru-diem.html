<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trừ điểm người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: none !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .title-main {
            color: #0d6efd;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(13, 110, 253, 0.3);
        }

        .subtitle {
            color: #495057;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ced4da;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            height: 55px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        .admin-info {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="header">
            TRỪ ĐIỂM NGƯỜI DÙNG
        </div>
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h4>Thông tin người dùng</h4>
                <p class="fs-5">
                    <strong>Tên đăng nhập:</strong> <span th:text="${nguoiDung.tenDangNhap}" class="text-warning">user123</span><br>
                    <strong>Họ tên:</strong> <span th:text="${nguoiDung.hoTen}">Nguyễn Văn A</span><br>
                    <strong class="text-danger fs-4">Số dư hiện tại: <span th:text="${#numbers.formatInteger(soDuHienTai, 0, 'COMMA')}">0</span> điểm</strong>
                </p>
            </div>

            <form th:action="@{/admin/tru-diem/{id}(id=${nguoiDung.id})}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold text-danger">Số điểm cần trừ</label>
                    <input type="number" name="soTien" class="form-control form-control-lg text-center" 
                           min="1" required placeholder="Nhập số điểm"/>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Lý do trừ điểm</label>
                    <textarea name="moTa" class="form-control" rows="3" 
                              placeholder="Ví dụ: Vi phạm nội quy, trễ deadline..."></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-danger btn-lg px-5 rounded-pill shadow-lg">
                        XÁC NHẬN TRỪ ĐIỂM
                    </button>
                    <a th:href="@{/admin}" class="btn btn-secondary btn-lg px-5 rounded-pill ms-3">
                        Hủy bỏ
                    </a>
                    <a th:href="@{/admin}" class="btn btn-secondary btn-lg px-5 rounded-pill ms-3 shadow">
                        Quay lại Dashboard
                    </a>
                </div>
            </form>

            <div th:if="${error}" class="alert alert-warning mt-4 text-center fw-bold">
                <span th:text="${error}">Lỗi</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
