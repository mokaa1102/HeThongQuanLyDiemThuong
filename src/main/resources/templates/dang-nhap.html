<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Hệ thống Ví Điểm Thưởng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: none !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .title-main {
            color: #0d6efd;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(13, 110, 253, 0.3);
        }

        .subtitle {
            color: #495057;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ced4da;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            height: 55px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        .admin-info {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1 class="title-main">HỆ THỐNG VÍ ĐIỂM THƯỞNG</h1>
    <p class="subtitle">NHÓM 8 - D24TXCN05-K</p>

    <form th:action="@{/dang-nhap}" method="post">
        <div class="mb-3">
            <input type="text" name="tenDangNhap" class="form-control" 
                   placeholder="Tên đăng nhập" required autofocus/>
        </div>
        <div class="mb-4">
            <input type="password" name="matKhau" class="form-control" 
                   placeholder="Mật khẩu" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-login w-100">
            ĐĂNG NHẬP
        </button>
    </form>

    <div th:if="${error}" class="alert alert-danger mt-4">
        <span th:text="${error}">Sai thông tin!</span>
    </div>

</body>
</html>
