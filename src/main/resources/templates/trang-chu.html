<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ - Nhóm 8</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: none !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .title-main {
            color: #0d6efd;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(13, 110, 253, 0.3);
        }

        .subtitle {
            color: #495057;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ced4da;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            height: 55px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        .admin-info {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="header">HỆ THỐNG ĐIỂM THƯỞNG - NHÓM 8</div>
<div class="container mt-5">
    <div class="text-center text-white mb-5">
        <h1>Xin chào, <span th:text="${user.hoTen}">Admin</span>!</h1>
        <h2>Số dư: <td th:text="${#numbers.formatInteger(soDu, 0, 'COMMA')}"></td></h2>
    </div>

    <div th:if="${success}" class="alert alert-success text-center">
        <strong th:text="${success}"></strong>
    </div>

    <div class="row mt-4 justify-content-center g-4">
        <div class="col-md-3">
            <a href="/nap-diem" class="btn btn-success btn-lg w-100 p-4 rounded-4 shadow">NẠP ĐIỂM</a>
        </div>
        <div class="col-md-3">
            <a href="/chuyen-diem" class="btn btn-danger btn-lg w-100 p-4 rounded-4 shadow">CHUYỂN ĐIỂM</a>
        </div>
        <div class="col-md-3">
            <a href="/lich-su" class="btn btn-info btn-lg w-100 p-4 rounded-4 shadow text-white">LỊCH SỬ</a>
        </div>
        <div th:if="${user.vaiTro == 'ADMIN'}" class="col-md-3">
            <a href="/admin" class="btn btn-warning btn-lg w-100 p-4 rounded-4 shadow text-dark fw-bold">QUẢN TRỊ</a>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="/dang-xuat" class="btn btn-outline-light btn-lg btn-danger p-4 shadow">ĐĂNG XUẤT</a>
    </div>
</div>
</body>
</html>
