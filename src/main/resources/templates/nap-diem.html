<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nạp điểm - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: none !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .title-main {
            color: #0d6efd;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(13, 110, 253, 0.3);
        }

        .subtitle {
            color: #495057;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ced4da;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            height: 55px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        .admin-info {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div th:if="${session.user.vaiTro == 'ADMIN'}">
        <h2 class="text-center mb-4 text-primary">QUẢN LÝ NẠP ĐIỂM (ADMIN)</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                <h5>Nạp điểm cho người dùng</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/nap-diem}" method="post">
                    <div class="row">
                        <div class="col-md-5">
                            <label>Chọn người nhận:</label>
                            <select name="tenDangNhap" class="form-control" required>
                                <option value="">-- Chọn người dùng --</option>
                                <th:block th:each="u : ${users}">
                                    <option th:value="${u.tenDangNhap}" th:text="${u.tenDangNhap} + ' - ' + ${u.hoTen}"></option>
                                </th:block>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Số điểm:</label>
                            <input type="number" name="soDiem" class="form-control" min="1" required placeholder="VD: 100">
                        </div>
                        <div class="col-md-2">
                            <label>&nbsp;</label>
                            <button type="submit" class="btn btn-success form-control">Nạp ngay</button>
                        </div>
                    </div>
                    <div class="mt-3">
                        <input type="text" name="moTa" class="form-control" placeholder="Lý do nạp (khuyến mãi, tặng điểm, hoàn tiền...)">
                    </div>
                </form>
            </div>
        </div>
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">
                    Danh sách người dùng hiện có 
                    <span class="badge bg-warning text-dark" th:text="${#lists.size(users)}"></span> người
                </h4>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-dark mb-0">
                        <thead class="table-warning text-dark">
                            <tr>
                                <th>ID</th>
                                <th>Tên đăng nhập</th>
                                <th>Họ tên</th>
                                <th>Vai trò</th>
                                <th>Số dư ví</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}"></td>
                                <td><strong th:text="${u.tenDangNhap}"></strong></td>
                                <td th:text="${u.hoTen != null && !u.hoTen.isEmpty() ? u.hoTen : 'Chưa đặt'}"></td>
                                <td>
                                    <span th:if="${u.vaiTro == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
                                    <span th:unless="${u.vaiTro == 'ADMIN'}" class="badge badge-user">USER</span>
                                </td>
                                <td class="fw-bold text-warning">
                                    <span th:text="${soDuMap[u.id] != null ? #numbers.formatInteger(soDuMap[u.id], 0, 'COMMA') : '0'}"></span> điểm
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a th:href="@{/admin}" class="btn btn-warning btn-lg px-5 rounded-pill shadow">Quay lại Dashboard</a>
        </div>
    </div>

    <div th:if="${session.user.vaiTro != 'ADMIN'}" class="btn btn-warning btn-lg px-5 rounded-pill shadow">
        <h3>Chức năng nạp điểm chỉ dành cho Admin</h3>
        <a th:href="@{/trang-chu}" class="btn btn-primary">Về trang chủ</a>
    </div>
</div>
</body>
</html>
