<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Chuyển điểm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/img/bg.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: none !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 40px 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .title-main {
            color: #0d6efd;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(13, 110, 253, 0.3);
        }

        .subtitle {
            color: #495057;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            border: 2px solid #ced4da;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            height: 55px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #0d6efd;
            border: none;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
        }

        .admin-info {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="header">CHUYỂN ĐIỂM</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-5">
                <h4 class="text-center text-warning mb-4">
                    Số dư hiện tại: <strong th:text="${#numbers.formatInteger(soDu.longValue(), 0, 'COMMA')} + ' điểm'"></strong>
                </h4>
                <form th:action="@{/chuyen-diem}" method="post">
                    <div class="mb-3">
                        <input type="text" name="nguoiNhan" class="form-control form-control-lg" 
                               placeholder="Tên người nhận (Tên đăng nhập)" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" name="soTien" class="form-control form-control-lg" 
                               placeholder="Số điểm chuyển (VD: 100)" min="1" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" name="moTa" class="form-control" value="Tặng điểm" required>
                    </div>
                    <button type="submit" class="btn btn-danger btn-lg w-100 rounded-pill shadow">CHUYỂN NGAY</button>
                </form>
                <div th:if="${error}" class="alert alert-danger mt-3 text-center" th:text="${error}"></div>
                <div class="text-center mt-3">
                    <a href="/trang-chu" class="btn btn-success btn-lg shadow">Quay lại</a>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center mt-4">
        <a href="/trang-chu" class="btn btn-primary btn-lg px-5">Quay lại trang chủ</a>
    </div>
</div>
</body>
</html>
